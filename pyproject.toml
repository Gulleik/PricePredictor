[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/scenario", "tests/integration"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "unit: fast isolated tests for pure logic, parsing, and validators",
    "scenario: strategy behavior tests using synthetic market data",
    "integration: script orchestration tests with mocked dependencies",
]
